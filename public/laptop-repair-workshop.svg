<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#299fce;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#1E282A;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Workshop background -->
  <rect x="0" y="400" width="800" height="200" fill="#f8f9fa" opacity="0.8"/>

  <!-- Workbench -->
  <rect x="50" y="350" width="700" height="50" fill="#e9ecef" stroke="#dee2e6" stroke-width="2"/>

  <!-- Laptops being repaired -->
  <rect x="100" y="300" width="120" height="80" fill="#343a40" rx="8"/>
  <rect x="105" y="305" width="110" height="65" fill="#495057" rx="4"/>
  <rect x="110" y="310" width="100" height="55" fill="#000" rx="2"/>

  <rect x="300" y="290" width="140" height="90" fill="#343a40" rx="8"/>
  <rect x="305" y="295" width="130" height="75" fill="#495057" rx="4"/>
  <rect x="310" y="300" width="120" height="65" fill="#000" rx="2"/>

  <rect x="500" y="305" width="110" height="75" fill="#343a40" rx="8"/>
  <rect x="505" y="310" width="100" height="60" fill="#495057" rx="4"/>
  <rect x="510" y="315" width="90" height="50" fill="#000" rx="2"/>

  <!-- Tools -->
  <circle cx="650" cy="320" r="15" fill="#299fce"/>
  <rect x="645" y="305" width="10" height="30" fill="#6c757d"/>
  <rect x="680" y="310" width="40" height="8" fill="#299fce" rx="4"/>
  <rect x="680" y="325" width="35" height="6" fill="#6c757d" rx="3"/>
  <rect x="680" y="340" width="45" height="10" fill="#299fce" rx="5"/>

  <!-- Parts and components -->
  <rect x="120" y="380" width="15" height="15" fill="#299fce" rx="2"/>
  <rect x="140" y="385" width="12" height="8" fill="#343a40" rx="1"/>
  <rect x="160" y="382" width="18" height="12" fill="#299fce" rx="2"/>
  <rect x="320" y="378" width="20" height="20" fill="#343a40" rx="3"/>
  <rect x="350" y="380" width="16" height="16" fill="#299fce" rx="2"/>

  <!-- Workshop lighting -->
  <ellipse cx="200" cy="100" rx="80" ry="40" fill="#fff" opacity="0.3"/>
  <ellipse cx="400" cy="80" rx="100" ry="50" fill="#fff" opacity="0.25"/>
  <ellipse cx="600" cy="120" rx="90" ry="45" fill="#fff" opacity="0.2"/>

  <!-- Repair shop ambiance -->
  <rect x="0" y="0" width="800" height="100" fill="url(#bg)" opacity="0.5"/>

  <!-- Text -->
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#299fce" text-anchor="middle" opacity="0.6">Trí Nhân Laptop</text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="16" fill="#1E282A" text-anchor="middle" opacity="0.5">Chuyên nghiệp - Uy tín - Chất lượng</text>
</svg>