_format_version: "1.1"

consumers:
  - username: anon
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  - username: service_role
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: service_role

services:
  - name: rest-v1
    _comment: "PostgREST: /rest/v1/* -> http://rest-dev:3000/*"
    url: http://rest-dev:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - HEAD
                - PUT
                - PATCH
                - POST
                - DELETE
              headers:
                - "*"
              exposed_headers:
                - "*"
              credentials: true
              max_age: 3600
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - anon
                - service_role

  - name: auth-v1
    _comment: "GoTrue: /auth/v1/* -> http://auth-dev:9999/*"
    url: http://auth-dev:9999
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - HEAD
                - PUT
                - PATCH
                - POST
                - DELETE
              headers:
                - "*"
              exposed_headers:
                - "*"
              credentials: true
              max_age: 3600
          - name: key-auth
            config:
              hide_credentials: false
          - name: acl
            config:
              hide_groups_header: true
              allow:
                - anon
                - service_role

  - name: storage-v1
    _comment: "Storage: /storage/v1/* -> http://storage-dev:5000/*"
    url: http://storage-dev:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
        plugins:
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - HEAD
                - PUT
                - PATCH
                - POST
                - DELETE
              headers:
                - "*"
              exposed_headers:
                - "*"
              credentials: true
              max_age: 3600
          - name: key-auth
            config:
              hide_credentials: false