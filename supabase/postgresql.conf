# PostgreSQL configuration for Vietnamese Laptop Repair Shop
# Minimal configuration for Supabase compatibility

# Basic settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory settings
shared_buffers = 128MB
work_mem = 4MB

# Logging
log_statement = 'none'
log_duration = off

# Timezone
timezone = 'UTC'

# Row Level Security
row_security = on